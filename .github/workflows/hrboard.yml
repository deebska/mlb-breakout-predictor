name: HR Board auto-update

on:
  schedule:
    - cron: "0 10 * * *"    # 6am ET: data update + score yesterday
    - cron: "0 15 * * *"    # 11am ET
    - cron: "0 16 * * *"    # noon ET
    - cron: "0 17 * * *"    # 1pm ET
    - cron: "0 19 * * *"    # 3pm ET
    - cron: "0 21 * * *"    # 5pm ET
    - cron: "30 22 * * *"   # 6:30pm ET
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hrboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Update Statcast store + talent tables
        run: python statcast_talent.py update

      - name: Score yesterday + refresh results page
        run: |
          python track_results.py score || true
          python make_results_page.py && cp results.html public/results.html || true

      - name: Compose board (skips cleanly if no lineups posted)
        id: board
        run: |
          set +e
          python board.py
          code=$?
          if [ "$code" = "3" ]; then
            echo "publish=no" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$code" != "0" ]; then
            exit $code
          fi
          echo "publish=yes" >> "$GITHUB_OUTPUT"

      - name: Generate board page
        if: steps.board.outputs.publish == 'yes'
        run: |
          python make_page.py
          cp hrboard.html public/hrboard.html

      - name: Commit everything
        run: |
          git config user.name "hrboard-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
