name: HR Board auto-update

on:
  schedule:
    - cron: "0 10 * * *"    # 6am ET: data update + score yesterday
    - cron: "0 14 * * *"    # 10am ET
    - cron: "0 15 * * *"    # 11am ET -- hourly from here (lateness backstop)
    - cron: "0 16 * * *"    # noon ET
    - cron: "0 17 * * *"    # 1pm ET
    - cron: "0 18 * * *"    # 2pm ET
    - cron: "0 19 * * *"    # 3pm ET
    - cron: "0 20 * * *"    # 4pm ET
    - cron: "0 21 * * *"    # 5pm ET
    - cron: "0 22 * * *"    # 6pm ET
    - cron: "0 23 * * *"    # 7pm ET final sweep
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hrboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Update Statcast store + talent tables
        run: python statcast_talent.py update

      - name: Score yesterday + refresh results page
        run: |
          python track_results.py score || true
          python make_results_page.py && cp results.html public/results.html || true

      - name: Pull HR prop odds (Polymarket, free)
        run: python odds_pull_poly.py || true

      - name: Box office tracker
        run: |
          python box_office.py update || true
          python rumor_scan.py || true
      - name: Claude daily read (September book)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python claude_daily.py || true
      - name: Box office page
        run: python make_bo_page.py && cp bo.html public/bo.html || true
        
      - name: NFL system + page
        run: |
          python nfl_system.py update || true
          python make_nfl_page.py && cp nfl.html public/nfl.html || true

      - name: Compose board (skips cleanly if no lineups posted)
        id: board
        run: |
          set +e
          python board.py
          code=$?
          if [ "$code" = "3" ]; then
            echo "publish=no" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$code" != "0" ]; then
            exit $code
          fi
          echo "publish=yes" >> "$GITHUB_OUTPUT"

      - name: Generate board page
        if: steps.board.outputs.publish == 'yes'
        run: |
          python make_page.py
          cp hrboard.html public/hrboard.html

      - name: Commit everything
        run: |
          git config user.name "hrboard-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
